name: Auto-Refresh Activity Stats Cache

on:
  schedule:
    # Runs every 6 hours automatically (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch: # Allows manual one-click refresh from Actions tab

jobs:
  refresh-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update Streak Stats and README Cache Busters
        run: |
          python3 scripts/update_stats.py

      - name: Commit and Push if Changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/streak-stats.svg README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(stats): update live streak and refresh cache [skip ci]"
            git push
          fi
