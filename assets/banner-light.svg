<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img">
  <title>Atia Sanjida (Oishi) - GitHub Profile Banner (Light)</title>
  <defs>
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f6f8fa"/>
      <stop offset="100%" stop-color="#f0f3f6"/>
    </linearGradient>

    <linearGradient id="borderGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da">
        <animate attributeName="stop-color" values="#0969da;#8250df;#1a7f37;#0969da" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#8250df">
        <animate attributeName="stop-color" values="#8250df;#1a7f37;#0969da;#8250df" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1a7f37">
        <animate attributeName="stop-color" values="#1a7f37;#0969da;#8250df;#1a7f37" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="textGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da"/>
      <stop offset="50%" stop-color="#8250df"/>
      <stop offset="100%" stop-color="#1a7f37"/>
    </linearGradient>

    <linearGradient id="laserGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8250df" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1a7f37" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Cyber Binary Matrix Pattern (Subtle Light Hacker Theme) -->
    <pattern id="cyberBinaryLight" width="340" height="96" patternUnits="userSpaceOnUse">
      <text x="10" y="20" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="10" fill="#0969da" fill-opacity="0.08" letter-spacing="3">01001001 01000011 01000101 00100000</text>
      <text x="45" y="44" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="10" fill="#1a7f37" fill-opacity="0.08" letter-spacing="3">01010011 01000101 01000011 01010101</text>
      <text x="15" y="68" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="10" fill="#0969da" fill-opacity="0.07" letter-spacing="3">01010011 01011001 01010011 01010100</text>
      <text x="50" y="92" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="10" fill="#8250df" fill-opacity="0.07" letter-spacing="3">01001100 01001110 01011000 00100000</text>
    </pattern>

    <!-- Tactical Cyber Grid Lines -->
    <pattern id="cyberGridLight" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0969da" stroke-width="0.7" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <style>
    .role-1, .role-2, .role-3, .role-4 {
      opacity: 0;
      animation-duration: 20s;
      animation-iteration-count: infinite;
      animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }
    .role-1 { animation-name: role1; }
    .role-2 { animation-name: role2; }
    .role-3 { animation-name: role3; }
    .role-4 { animation-name: role4; }

    @keyframes role1 {
      0%        { opacity: 1; transform: translateY(0); }
      18%       { opacity: 1; transform: translateY(0); }
      22%       { opacity: 0; transform: translateY(-4px); }
      23%, 95%  { opacity: 0; transform: translateY(4px); }
      99%       { opacity: 0.8; transform: translateY(1px); }
      100%      { opacity: 1; transform: translateY(0); }
    }
    @keyframes role2 {
      0%, 22%   { opacity: 0; transform: translateY(4px); }
      26%       { opacity: 1; transform: translateY(0); }
      43%       { opacity: 1; transform: translateY(0); }
      47%       { opacity: 0; transform: translateY(-4px); }
      48%, 100% { opacity: 0; transform: translateY(4px); }
    }
    @keyframes role3 {
      0%, 47%   { opacity: 0; transform: translateY(4px); }
      51%       { opacity: 1; transform: translateY(0); }
      68%       { opacity: 1; transform: translateY(0); }
      72%       { opacity: 0; transform: translateY(-4px); }
      73%, 100% { opacity: 0; transform: translateY(4px); }
    }
    @keyframes role4 {
      0%, 72%   { opacity: 0; transform: translateY(4px); }
      76%       { opacity: 1; transform: translateY(0); }
      93%       { opacity: 1; transform: translateY(0); }
      97%       { opacity: 0; transform: translateY(-4px); }
      98%, 100% { opacity: 0; transform: translateY(4px); }
    }
  </style>

  <rect width="1000" height="290" rx="18" fill="url(#bgGradLight)"/>
  <rect width="1000" height="290" rx="18" fill="url(#cyberGridLight)"/>
  <rect width="1000" height="290" rx="18" fill="url(#cyberBinaryLight)"/>



  <rect x="1" y="1" width="998" height="288" rx="17" fill="none" stroke="url(#borderGradLight)" stroke-width="2"/>

  <!-- Status Badge in Top Right Corner -->
  <g transform="translate(680, 24)">
    <rect width="290" height="26" rx="13" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
    <circle cx="16" cy="13" r="4.5" fill="#0969da">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="30" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0969da" letter-spacing="0.5">B.SC. ICE • SYSTEMS &amp; SECURITY 🛡️</text>
  </g>

  <!-- Monogram Box -->
  <g transform="translate(48, 54)">
    <rect width="112" height="112" rx="24" fill="#ffffff" stroke="url(#borderGradLight)" stroke-width="2"/>
    <circle cx="56" cy="56" r="44" fill="#f6f8fa"/>
    <path d="M42 46 L30 56 L42 66" fill="none" stroke="#0969da" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M70 46 L82 56 L70 66" fill="none" stroke="#8250df" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="58" y1="44" x2="54" y2="68" stroke="#1a7f37" stroke-width="3.2" stroke-linecap="round"/>
  </g>

  <!-- Name -->
  <g transform="translate(182, 82)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0969da" letter-spacing="1">
      HI THERE, I'M
    </text>
    <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="url(#textGradLight)" letter-spacing="0.5">
      Atia Sanjida (Oishi)
    </text>
    <text x="350" y="34" font-size="28">👋</text>
  </g>

              <!-- Dynamic Cycling Roles -->
  <g transform="translate(182, 154)">
    <g class="role-1">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#1f2328">
        🛡️ <tspan fill="#0969da" font-weight="700">Security Researcher</tspan> <tspan fill="#57606a">•</tspan> <tspan fill="#24292f">Cybersecurity &amp; Ethical Hacking</tspan>
      </text>
    </g>
    <g class="role-2">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#1f2328">
        🐧 <tspan fill="#8250df" font-weight="700">Systems Engineering Learner</tspan>
      </text>
    </g>
    <g class="role-3">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#1f2328">
        🤖 <tspan fill="#1a7f37" font-weight="700">Currently Learning</tspan> <tspan fill="#57606a">•</tspan> <tspan fill="#24292f">AI/ML &amp; Agentic AI</tspan>
      </text>
    </g>
    <g class="role-4">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#1f2328">
        🎓 <tspan fill="#cf222e" font-weight="700">B.Sc. Student</tspan> <tspan fill="#57606a">•</tspan> <tspan fill="#24292f">Information &amp; Communication Engineering</tspan>
      </text>
    </g>
  </g>

  <!-- Tagline Quote -->
  <g transform="translate(48, 222)">
    <rect width="904" height="42" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="24" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#8b949e">
      🎓 <tspan fill="#1f2328" font-weight="500">"B.Sc. student in Information &amp; Communication Engineering — exploring Systems, Security, and Agentic AI."</tspan>
    </text>
  </g>

  <rect x="0" y="286" width="180" height="3" rx="1.5" fill="url(#laserGradLight)">
    <animate attributeName="x" values="0;820;0" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
