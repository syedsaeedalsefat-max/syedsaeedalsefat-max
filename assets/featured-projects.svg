    <rect x="20" y="20" width="36" height="36" rx="8" fill="url(#greenG)"/>
    <text x="38" y="44" font-size="18" text-anchor="middle">🌳</text>

    <text x="68" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Git-Learning</text>
    <text x="68" y="52" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#7ee787">36 SECTIONS • OBJECT STORE • DAGS • 50+ SVG DIAGRAMS</text>

    <text x="20" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#8b949e">
