    <text x="38" y="44" font-size="18" text-anchor="middle">⚡</text>

    <text x="68" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">smart-home-security-bot &amp; CV</text>
    <text x="68" y="52" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#d2a8ff">ESP32 WIFI CSI • TELEGRAM ALERTS • YOLOV8 TRACKING</text>

    <text x="20" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#8b949e">
