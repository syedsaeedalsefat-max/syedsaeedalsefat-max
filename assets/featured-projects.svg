  <!-- Project 1: Learning-Linux -->
  <g transform="translate(10, 10)">
    <rect width="480" height="140" rx="14" fill="url(#cardGrad)" stroke="#388bfd" stroke-width="1.2"/>
    
    <rect x="20" y="20" width="36" height="36" rx="8" fill="url(#blueG)"/>
    <text x="38" y="44" font-size="18" text-anchor="middle">🐧</text>

    <text x="68" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Learning-Linux</text>
    <text x="68" y="52" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#58a6ff">UBUNTU • KALI • FEDORA • KERNEL VS USER SPACE</text>

    <text x="20" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#8b949e">
      A unified, hands-on Linux manual covering system architectures, boot
    </text>
    <text x="20" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#8b949e">
      flows, FHS hierarchy, permissions, and multi-distro terminal administration.
    </text>

    <!-- Tag -->
    <rect x="20" y="112" width="105" height="18" rx="9" fill="#1f242c" stroke="#388bfd" stroke-width="0.8"/>
    <text x="72" y="125" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#79c0ff" text-anchor="middle">SYSTEMS ARCH</text>
