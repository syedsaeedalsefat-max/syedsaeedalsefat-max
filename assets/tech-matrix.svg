<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img">
  <title>Atia Sanjida - Technical Skills Matrix</title>
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b72"/>
      <stop offset="100%" stop-color="#f85149"/>
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7ee787"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d2a8ff"/>
      <stop offset="100%" stop-color="#8957e5"/>
    </linearGradient>
  </defs>

  <!-- Card 1: Security & Systems -->
  <g>
    <rect x="10" y="10" width="233" height="245" rx="16" fill="url(#cardBg)" stroke="#f85149" stroke-opacity="0.8" stroke-width="1.5"/>
    
    <rect x="24" y="24" width="38" height="38" rx="10" fill="url(#redGrad)"/>
    <path d="M43 33 L51 37 V45 C51 51 43 55 43 55 C43 55 35 51 35 45 V37 Z" fill="#ffffff" fill-opacity="0.25" stroke="#ffffff" stroke-width="1.8"/>
    
    <text x="70" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Security &amp; Hacking</text>
    <text x="70" y="58" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="500" fill="#ff7b72">ETHICAL HACKING LABS</text>

    <text x="24" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#c9d1d9">• OWASP Top 10 Concepts</text>
    <text x="24" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#c9d1d9">• SQL Injection (SQLi) Labs</text>
    <text x="24" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#c9d1d9">• XSS Vectors &amp; Defenses</text>
    <text x="24" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#c9d1d9">• OSINT &amp; Recon Workflows</text>
    <text x="24" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#c9d1d9">• Wireshark Network Analysis</text>

    <rect x="24" y="218" width="205" height="22" rx="11" fill="#21262d" stroke="#f85149" stroke-width="0.8"/>
    <text x="126" y="233" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#ff7b72" text-anchor="middle">DEFENSIVE &amp; ETHICAL</text>
  </g>

  <!-- Card 2: Linux & Systems -->
  <g>
    <rect x="257" y="10" width="233" height="245" rx="16" fill="url(#cardBg)" stroke="#388bfd" stroke-opacity="0.8" stroke-width="1.5"/>
    
    <rect x="271" y="24" width="38" height="38" rx="10" fill="url(#blueGrad)"/>
    <text x="290" y="49" font-size="20" text-anchor="middle">🐧</text>

    <text x="317" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Systems &amp; Linux</text>
    <text x="317" y="58" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="500" fill="#79c0ff">OS &amp; KERNEL INTERNALS</text>

    <text x="271" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#c9d1d9">• Linux FHS &amp; Permissions</text>
    <text x="271" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#c9d1d9">• Ubuntu, Kali &amp; Fedora</text>
    <text x="271" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#c9d1d9">• C &amp; C++ Systems Foundations</text>
    <text x="271" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#c9d1d9">• Process Memory &amp; System Calls</text>
    <text x="271" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#c9d1d9">• Network Protocols &amp; Sockets</text>

    <rect x="271" y="218" width="205" height="22" rx="11" fill="#21262d" stroke="#388bfd" stroke-width="0.8"/>
    <text x="373" y="233" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#79c0ff" text-anchor="middle">SYSTEMS &amp; LINUX</text>
  </g>

  <!-- Card 3: Simulation & Tools -->
  <g>
    <rect x="504" y="10" width="233" height="245" rx="16" fill="url(#cardBg)" stroke="#2ea043" stroke-opacity="0.8" stroke-width="1.5"/>
    
    <rect x="518" y="24" width="38" height="38" rx="10" fill="url(#greenGrad)"/>
    <text x="537" y="49" font-size="20" text-anchor="middle">⚙️</text>

    <text x="564" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Engineering &amp; Tools</text>
    <text x="564" y="58" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="500" fill="#7ee787">3D, SIMULATION &amp; CAD</text>

    <text x="518" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#c9d1d9">• Unreal Engine 5 Simulation</text>
    <text x="518" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#c9d1d9">• MATLAB Engineering Compute</text>
    <text x="518" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#c9d1d9">• AutoCAD Technical Design</text>
    <text x="518" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#c9d1d9">• CST Studio Suite (Antenna)</text>
    <text x="518" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#c9d1d9">• Git Internals &amp; SQLite</text>

    <rect x="518" y="218" width="205" height="22" rx="11" fill="#21262d" stroke="#2ea043" stroke-width="0.8"/>
    <text x="620" y="233" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#7ee787" text-anchor="middle">SIMULATION &amp; DEV</text>
  </g>

  <!-- Card 4: AI, ML & Agentic AI -->
  <g>
    <rect x="751" y="10" width="233" height="245" rx="16" fill="url(#cardBg)" stroke="#8957e5" stroke-opacity="0.8" stroke-width="1.5"/>
    
    <rect x="765" y="24" width="38" height="38" rx="10" fill="url(#purpleGrad)"/>
    <text x="784" y="49" font-size="20" text-anchor="middle">🤖</text>

    <text x="811" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">AI, ML &amp; Agentic AI</text>
    <text x="811" y="58" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="500" fill="#d2a8ff">CURRENT &amp; APPLIED WORK</text>

    <text x="765" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#c9d1d9">• Agentic AI &amp; Workflows</text>
    <text x="765" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#c9d1d9">• YOLOv8 Vehicle Detection</text>
    <text x="765" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#c9d1d9">• OpenCV Video Pipelines</text>
    <text x="765" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#c9d1d9">• Machine Learning Models</text>
    <text x="765" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#c9d1d9">• Dataset Numbering Tools</text>

    <rect x="765" y="218" width="205" height="22" rx="11" fill="#21262d" stroke="#8957e5" stroke-width="0.8"/>
    <text x="867" y="233" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#d2a8ff" text-anchor="middle">AI &amp; AGENTIC SYSTEMS</text>
  </g>
</svg>