<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img">
  <title>Curtroder - Futuristic Termux Theme</title>
  <defs>
    <!-- Dark Termux Cyber Window Background -->
    <linearGradient id="termuxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="50%" stop-color="#070c1a"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <!-- Neon Cyan to Mint Border Glow -->
    <linearGradient id="curtroderBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>

    <!-- Holographic Hacker Gradient for Full Name -->
    <linearGradient id="hackerNameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="35%" stop-color="#00ff88"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="hackerGlow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Binary Matrix Background Pattern -->
    <pattern id="matrixPattern" width="300" height="80" patternUnits="userSpaceOnUse">
      <text x="10" y="20" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9" fill="#00ff88" fill-opacity="0.04" letter-spacing="2">01010011 01011001 01000101 01000100</text>
      <text x="30" y="45" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9" fill="#00f0ff" fill-opacity="0.035" letter-spacing="2">01000011 01010101 01010010 01010100</text>
      <text x="15" y="70" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9" fill="#00ff88" fill-opacity="0.04" letter-spacing="2">01010011 01000101 01000110 01000001</text>
    </pattern>
  </defs>

  <style>
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }
    .font-hacker {
      font-family: 'Orbitron', 'Share Tech Mono', 'JetBrains Mono', 'Segoe UI', monospace;
    }
    
    /* Blinking Cursor Animation */
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .cursor {
      animation: cursorBlink 0.9s infinite;
    }

    /* Loading Bar Pulse Animation */
    @keyframes loadPulse {
      0% { opacity: 0.65; }
      50% { opacity: 1; }
      100% { opacity: 0.65; }
    }
    .load-bar {
      animation: loadPulse 2.2s infinite ease-in-out;
    }

    /* Hacker Transition: Chromatic Glitch Shift + Pulse */
    @keyframes hackerTransition {
      0% {
        transform: translate(0, 0);
        filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.7));
      }
      20% {
        transform: translate(-1px, 1px);
        filter: drop-shadow(2px 0 10px rgba(0, 255, 136, 0.85));
      }
      40% {
        transform: translate(1px, -1px);
        filter: drop-shadow(-2px 0 12px rgba(0, 240, 255, 0.9));
      }
      60% {
        transform: translate(-1px, 0);
        filter: drop-shadow(0 0 15px rgba(168, 85, 247, 0.8));
      }
      80% {
        transform: translate(1px, 1px);
        filter: drop-shadow(1px 0 10px rgba(0, 255, 136, 0.85));
      }
      100% {
        transform: translate(0, 0);
        filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.7));
      }
    }

    .hacker-name {
      animation: hackerTransition 4s infinite ease-in-out;
    }

    @keyframes badgePulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
    .hacker-badge {
      animation: badgePulse 2.5s infinite;
    }
  </style>

  <!-- Terminal Window Canvas -->
  <rect width="1000" height="520" rx="14" fill="url(#termuxBg)"/>
  <rect width="1000" height="520" rx="14" fill="url(#matrixPattern)"/>
  <rect x="1" y="1" width="998" height="518" rx="13" fill="none" stroke="url(#curtroderBorder)" stroke-width="1.6" filter="url(#neonGlow)"/>

  <!-- Window Header Bar -->
  <line x1="1" y1="36" x2="999" y2="36" stroke="#182338" stroke-width="1"/>
  <circle cx="28" cy="18" r="5" fill="#ff5f56"/>
  <circle cx="44" cy="18" r="5" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="5" fill="#27c93f"/>

  <!-- Title Center -->
  <text x="500" y="23" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#8b949e" text-anchor="middle">
    syed@Curtroder: ~ (Termux Shell Session)
  </text>

  <!-- Right Pill: Curtroder Theme Online -->
  <circle cx="862" cy="18" r="4.5" fill="#00ff88">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="874" y="22" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#00ff88" letter-spacing="0.5">
    CURTRODER v1.0
  </text>

  <!-- Step 1: Loading Sequence -->
  <g class="font-mono" transform="translate(36, 62)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#00ff88">Syed Saeed Al Sefat ♚</text>
    <text x="0" y="18" font-size="12" font-weight="500" fill="#ffbd2e">Please wait a moment. system is loading...</text>
    
    <text x="0" y="38" font-size="12" font-weight="700" fill="#ff5555">#loading [</text>
    <text x="82" y="38" font-size="12" font-weight="700" fill="#00ff88" class="load-bar">████████████████████</text>
    <text x="242" y="38" font-size="12" font-weight="700" fill="#ff5555">] #Done</text>
  </g>

  <!-- Step 2: Welcome Message -->
  <g class="font-mono" transform="translate(36, 126)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#00ff88">Welcome Syed Saeed Al Sefat ♚</text>
    <text x="0" y="18" font-size="12" font-weight="600" fill="#00f0ff">System is ready.</text>
    <text x="0" y="36" font-size="12" font-weight="500" fill="#00ff88">Now you can complete your mission.</text>
  </g>

  <!-- Step 3: FULL NAME WITH HACKER TRANSITION (Plain, Clean, Vector-Rendered) -->
  <g transform="translate(500, 218)">
    <!-- Main Full Name Text with Hacker Transition Animation -->
    <text x="0" y="0" text-anchor="middle" class="font-hacker hacker-name" font-size="34" font-weight="900" fill="url(#hackerNameGrad)" letter-spacing="4" filter="url(#hackerGlow)">
      SYED SAEED AL SEFAT
    </text>

    <!-- Subtitle Hacker Badge -->
    <g transform="translate(0, 28)" class="font-mono hacker-badge">
      <rect x="-240" y="-14" width="480" height="24" rx="12" fill="#061224" fill-opacity="0.8" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="0" y="3" text-anchor="middle" font-size="11.5" font-weight="700" fill="#38bdf8" letter-spacing="2">
        ⚡ 0xROOT // SECURITY RESEARCHER &amp; PYTHON DEV ⚡
      </text>
    </g>
  </g>

  <!-- Step 4: Curtroder Info Box & Metadata -->
  <g class="font-mono" text-anchor="middle" transform="translate(500, 310)">
    <text x="0" y="0" font-size="12.5" font-weight="700" fill="#58a6ff">
      Developed By Syed Saeed Al Sefat ♚ | Team FoxBat | Curtroder
    </text>
    <text x="0" y="18" font-size="11.5" font-weight="600" fill="#ffbd2e">
      © Copyright 2026 — All Rights Reserved.
    </text>
    <text x="0" y="36" font-size="12" font-weight="500" fill="#ff5555" font-style="italic">
      "I am completely destroyed. Error 304 Not Modified."
    </text>
    <text x="0" y="56" font-size="11.5" font-weight="600" fill="#ff7b72">
      📅 Friday, 21 November 2026  |  ⏰ Active Session (UTC+8)
    </text>
    <text x="0" y="76" font-size="12" font-weight="700" fill="#00ff88">
      🌐 IP Address: 127.0.0.1 // 0xRoot (Encrypted Node)
    </text>
  </g>

  <!-- Step 5: Curtroder Custom Command Prompt (PS1) -->
  <g class="font-mono" transform="translate(36, 436)">
    <!-- Line 1 of PS1: ┌─[time]─[user@Curtroder]──[~/Team-FoxBat] -->
    <text x="0" y="0" font-size="13" font-weight="600">
      <tspan fill="#00f0ff">┌─[</tspan><tspan fill="#00ff88">18:30:00</tspan><tspan fill="#00f0ff">]─[</tspan><tspan fill="#00ff88">syed@Curtroder</tspan><tspan fill="#00f0ff">]──[</tspan><tspan fill="#79c0ff">~/Team-FoxBat</tspan><tspan fill="#00f0ff">]</tspan>
    </text>
    <!-- Line 2 of PS1: └─> command with blinking cursor -->
    <text x="0" y="24" font-size="13" font-weight="600">
      <tspan fill="#00f0ff">└─&gt;</tspan> <tspan fill="#ffffff" font-weight="500">python3 -m curtroder --active-mission</tspan>
    </text>
    <rect x="366" y="11" width="9" height="15" rx="1.5" fill="#00ff88" class="cursor"/>
  </g>
</svg>