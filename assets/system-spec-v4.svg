<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="1000" height="370" role="img">
  <title>Atia Sanjida - System Specifications &amp; Profile</title>
  <defs>
    <!-- Background Gradient: Deep Cyber Obsidian -->
    <linearGradient id="sysBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#080e1a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Subtle Refined Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#238636" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.65"/>
    </linearGradient>

    <!-- Soft Sci-Fi Glow Filters -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- High-Intensity Terminal Neon Glow Filter -->
    <filter id="terminalGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#0077ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="shieldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f7ff"/>
      <stop offset="30%" stop-color="#00c7ff"/>
      <stop offset="70%" stop-color="#0066cc"/>
      <stop offset="100%" stop-color="#002b66"/>
    </linearGradient>

    <linearGradient id="leftFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2d58"/>
      <stop offset="50%" stop-color="#061833"/>
      <stop offset="100%" stop-color="#020b18"/>
    </linearGradient>

    <linearGradient id="rightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05152b"/>
      <stop offset="60%" stop-color="#020914"/>
      <stop offset="100%" stop-color="#01040a"/>
    </linearGradient>

    <linearGradient id="lock3DBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c7ff"/>
      <stop offset="40%" stop-color="#0077dd"/>
      <stop offset="85%" stop-color="#0044aa"/>
      <stop offset="100%" stop-color="#002266"/>
    </linearGradient>

    <linearGradient id="lockGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="shackleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c7ff"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#70d6ff"/>
      <stop offset="100%" stop-color="#0077dd"/>
    </linearGradient>

    <!-- Subtle Dark Grid Lines -->
    <pattern id="sysGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#58a6ff" stroke-width="0.7" stroke-opacity="0.03"/>
    </pattern>
  </defs>

  <!-- Window Container -->
  <rect width="1000" height="370" rx="16" fill="url(#sysBg)"/>
  <rect width="1000" height="370" rx="16" fill="url(#sysGrid)"/>
  <rect x="1" y="1" width="998" height="368" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.2"/>

  <!-- Top Bar -->
  <rect x="1" y="1" width="998" height="38" rx="15" fill="#0d1117" fill-opacity="0.95"/>
  <rect x="1" y="20" width="998" height="19" fill="#0d1117" fill-opacity="0.95"/>
  <line x1="1" y1="39" x2="999" y2="39" stroke="#21262d" stroke-width="1"/>

  <!-- Window controls -->
  <circle cx="24" cy="19" r="5" fill="#ff5f56"/>
  <circle cx="42" cy="19" r="5" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="5" fill="#27c93f"/>

  <!-- Session Title -->
  <text x="500" y="24" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="600" fill="#8b949e" text-anchor="middle">
    atia@ice-station: ~ (fastfetch --profile overview)
  </text>

  <!-- Top Right Status -->
  <circle cx="910" cy="19" r="4" fill="#3fb950">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="922" y="23" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#3fb950">
    ONLINE
  </text>

  <!-- ================= LEFT COLUMN: EXPANDED PROPORTIONAL HUD AVATAR ================= -->
  <g transform="translate(24, 52)">
    <!-- Spacious Card Container: Width 268, Height 298 -->
    <rect width="268" height="298" rx="14" fill="#070c16" fill-opacity="0.85" stroke="#1b2434" stroke-width="1.2"/>
    
    <!-- Central Dial & Shield: Center at (134, 106) with Large Balanced HUD Geometry -->
    <g transform="translate(134, 106)">
      <!-- Soft Core Glow (Expanded to r=104) -->
      <circle cx="0" cy="0" r="104" fill="url(#coreGlow)"/>

      <!-- Outer Main Precision Bezel (Expanded to r=98, 196px Diameter) -->
      <circle cx="0" cy="0" r="98" fill="none" stroke="#214470" stroke-width="1.2" opacity="0.6"/>

      <!-- Cardinal Ticks (Extended Crosshairs from r=88 to 104) -->
      <g stroke="#00f0ff" stroke-width="1.6" opacity="0.85">
        <line x1="0" y1="-104" x2="0" y2="-88"/>
        <line x1="0" y1="88" x2="0" y2="104"/>
        <line x1="-104" y1="0" x2="-88" y2="0"/>
        <line x1="88" y1="0" x2="104" y2="0"/>
      </g>

      <!-- Diagonal & Hex Sub-Ticks (Precision Sensor Geometry) -->
      <g stroke="#388bfd" stroke-width="1" opacity="0.45">
        <!-- 45-degree corner ticks -->
        <line x1="64" y1="64" x2="70" y2="70"/>
        <line x1="-64" y1="64" x2="-70" y2="70"/>
        <line x1="-64" y1="-64" x2="-70" y2="-70"/>
        <line x1="64" y1="-64" x2="70" y2="-70"/>
        <!-- 30 & 60 degree ticks -->
        <line x1="79.7" y1="46.0" x2="84.9" y2="49.0"/>
        <line x1="46.0" y1="79.7" x2="49.0" y2="84.9"/>
        <line x1="-46.0" y1="79.7" x2="-49.0" y2="84.9"/>
        <line x1="-79.7" y1="46.0" x2="-84.9" y2="49.0"/>
        <line x1="-79.7" y1="-46.0" x2="-84.9" y2="-49.0"/>
        <line x1="-46.0" y1="-79.7" x2="-49.0" y2="-84.9"/>
        <line x1="46.0" y1="-79.7" x2="49.0" y2="-84.9"/>
        <line x1="79.7" y1="-46.0" x2="84.9" y2="-49.0"/>
      </g>

      <!-- Outer Segmented Rotating Tech Ring (r=84) -->
      <circle cx="0" cy="0" r="84" fill="none" stroke="#58a6ff" stroke-width="1.8" stroke-dasharray="6, 12, 10, 12" opacity="0.5">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="30s" repeatCount="indefinite"/>
      </circle>

      <!-- Main High-Tech Rotating Arc Ring (Expanded r=70, Dual-Tone Cyan/Blue) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
        <!-- Arc 1: Top-Right Cyan -->
        <path d="M 24 -66 A 70 70 0 0 1 66 24" fill="none" stroke="#00c7ff" stroke-width="3.2" stroke-linecap="round" filter="url(#softGlow)"/>
        <!-- Arc 2: Bottom-Left Blue -->
        <path d="M -24 66 A 70 70 0 0 1 -66 -24" fill="none" stroke="#388bfd" stroke-width="3.2" stroke-linecap="round" filter="url(#softGlow)"/>
        <!-- Subtle Data Node Dots -->
        <circle cx="66" cy="24" r="2.5" fill="#e0f7ff"/>
        <circle cx="-66" cy="-24" r="2.5" fill="#388bfd"/>
      </g>

      <!-- Inner Technical Calibration Ring (r=56) -->
      <circle cx="0" cy="0" r="56" fill="none" stroke="#58a6ff" stroke-width="0.9" stroke-dasharray="14, 6, 4, 6" opacity="0.4">
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="18s" repeatCount="indefinite"/>
      </circle>

      <!-- ================= 3D CYBER SECURITY SHIELD ================= -->
      <g filter="url(#softGlow)">
        <!-- Outer Shield 3D Frame -->
        <path d="M 0 -44 C 12 -47 28 -45 36 -35 C 41 -12 42 14 30 33 C 20 44 0 53 0 53 C 0 53 -20 44 -30 33 C -42 14 -41 -12 -36 -35 C -28 -45 -12 -47 0 -44 Z"
              fill="#030914"
              stroke="url(#shieldRim)"
              stroke-width="2.8"
              stroke-linejoin="round"/>

        <!-- Left 3D Facet -->
        <path d="M 0 -43 C -10 -46 -26 -44 -34 -34 C -39 -12 -38 13 -28 31 C -19 41 0 50 0 50 Z"
              fill="url(#leftFacet)"/>

        <!-- Right 3D Facet -->
        <path d="M 0 -43 C 10 -46 26 -44 34 -34 C 39 -12 38 13 28 31 C 19 41 0 50 0 50 Z"
              fill="url(#rightFacet)"/>

        <!-- Subtle Center Crease -->
        <line x1="0" y1="-43" x2="0" y2="51" stroke="#00c7ff" stroke-width="1" opacity="0.4"/>

        <!-- Top Crest Highlight -->
        <path d="M -33 -33 C -23 -43 -9 -45 0 -43 C 9 -45 23 -43 33 -33"
              fill="none"
              stroke="#ffffff"
              stroke-width="1.4"
              stroke-linecap="round"
              opacity="0.85"/>

        <!-- ================= 3D CYBER PADLOCK ================= -->
        <g transform="translate(0, 4)">
          <!-- Shackle Depth Shadow -->
          <path d="M -11 -3 L -11 -13 C -11 -21 11 -21 11 -13 L 11 -3"
                fill="none"
                stroke="#010610"
                stroke-width="6"
                stroke-linecap="round"/>

          <!-- Shackle Metallic Arch -->
          <path d="M -11 -3 L -11 -13 C -11 -21 11 -21 11 -13 L 11 -3"
                fill="none"
                stroke="url(#shackleGrad)"
                stroke-width="4"
                stroke-linecap="round"/>

          <!-- Shackle Top Highlight -->
          <path d="M -6 -19 C -2 -21 2 -21 6 -19"
                fill="none"
                stroke="#ffffff"
                stroke-width="1.6"
                stroke-linecap="round"/>

          <!-- 3D Lock Body -->
          <rect x="-19" y="-3" width="38" height="28" rx="5"
                fill="#010610" opacity="0.7"/>
          <rect x="-18.5" y="-3.5" width="37" height="27" rx="4.5"
                fill="url(#lock3DBase)"
                stroke="#00c7ff"
                stroke-width="1.2"/>

          <!-- Gloss Sheen -->
          <rect x="-17" y="-2.5" width="34" height="11" rx="3"
                fill="url(#lockGloss)"/>

          <!-- Cyber Keyhole -->
          <circle cx="0" cy="8" r="3.2" fill="#010915" stroke="#00c7ff" stroke-width="0.7"/>
          <path d="M -1.8 8 L 1.8 8 L 2.4 15 L -2.4 15 Z" fill="#010915" stroke="#00c7ff" stroke-width="0.7"/>
          <!-- Pulsing LED Core -->
          <circle cx="0" cy="8" r="1.3" fill="#00f0ff">
            <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
          </circle>
          <line x1="0" y1="9.5" x2="0" y2="13.5" stroke="#00c7ff" stroke-width="1" stroke-linecap="round"/>
        </g>
      </g>
    </g>

    <!-- Researcher Name & Degree: Proportional Spacing -->
    <text x="134" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700" fill="#f0f6fc" text-anchor="middle" letter-spacing="0.6">
      ATIA SANJIDA (OISHI)
    </text>
    <text x="134" y="244" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="500" fill="#79c0ff" text-anchor="middle" letter-spacing="0.4">
      B.Sc. in ICE, UNDERGRAD
    </text>

    <!-- Refined Active Pill -->
    <g transform="translate(42, 258)">
      <rect width="184" height="26" rx="13" fill="#041610" stroke="#238636" stroke-width="1.2"/>
      <circle cx="22" cy="13" r="3.8" fill="#3fb950">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="700" fill="#3fb950" letter-spacing="0.6">
        ACTIVE ON GITHUB
      </text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: HARMONIOUS COHESIVE TERMINAL SPECS ================= -->
  <g transform="translate(315, 52)">
    <!-- Command Prompt -->
    <text x="0" y="18" font-family="'JetBrains Mono', monospace" font-size="13.5" font-weight="500">
      <tspan fill="#3fb950" font-weight="700">atia@ice-station</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff" font-weight="700">~</tspan><tspan fill="#8b949e">$</tspan> <tspan fill="#f0f6fc" font-weight="600">fastfetch --profile overview</tspan>
    </text>

    <line x1="0" y1="30" x2="655" y2="30" stroke="#21262d" stroke-width="1"/>

    <!-- Spec Rows: Refined Two-Tone Technical Palette (Clean Labels, Cohesive High-Contrast Values) -->
    <g transform="translate(0, 56)">
      <!-- Row 1: Academics -->
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#79c0ff">Academics   :</text>
      <text x="145" y="0" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="500" fill="#f0f6fc">B.Sc. in Information &amp; Communication Eng. <tspan fill="#79c0ff" font-weight="600">(ICE)</tspan></text>

      <!-- Row 2: Workstation -->
      <text x="0" y="23" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#79c0ff">Workstation :</text>
      <text x="145" y="23" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="500" fill="#c9d1d9">Linux Workstation <tspan fill="#8b949e">(x86_64, Kali Linux &amp; Ubuntu LTS, Fedora)</tspan></text>

      <!-- Row 3: Core Track -->
      <text x="0" y="46" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#79c0ff">Core Track  :</text>
      <text x="145" y="46" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#f0f6fc">Systems Engineering <tspan fill="#79c0ff">&amp;</tspan> Defensive Security Research</text>

      <!-- Row 4: Security Lab -->
      <text x="0" y="69" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#79c0ff">Security Lab:</text>
      <text x="145" y="69" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="500" fill="#c9d1d9">Vulnerability Analysis, Ethical Hacking &amp; OS Internals</text>

      <!-- Row 5: Applied AI -->
      <text x="0" y="92" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#79c0ff">Applied AI  :</text>
      <text x="145" y="92" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="500" fill="#c9d1d9">Agentic AI Workflows &amp; Real-Time Computer Vision <tspan fill="#79c0ff">(YOLOv8)</tspan></text>

      <!-- Row 6: Engineering tools -->
      <text x="0" y="115" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#79c0ff">Engineering :</text>
      <text x="145" y="115" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="500" fill="#c9d1d9">2D/3D Simulation — CST Studio, MATLAB, AutoCAD, Unreal 5</text>

      <!-- Row 7: Methodology -->
      <text x="0" y="138" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#79c0ff">Methodology :</text>
      <text x="145" y="138" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="500" fill="#c9d1d9">First Principles — <tspan fill="#f0f6fc">"Dissecting systems from memory layout to logic"</tspan></text>

      <!-- Row 8: Profile Mode -->
      <text x="0" y="161" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#79c0ff">Profile Mode:</text>
      <text x="145" y="161" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#3fb950">Independent Systems Engineering Learner &amp; Security Researcher</text>
    </g>

    <!-- Harmonious Terminal Palette Blocks (Subtle & Elegant, Not Rainbow Clutter) -->
    <g transform="translate(0, 244)">
      <rect x="0" y="0" width="18" height="9" rx="2" fill="#21262d"/>
      <rect x="24" y="0" width="18" height="9" rx="2" fill="#30363d"/>
      <rect x="48" y="0" width="18" height="9" rx="2" fill="#388bfd"/>
      <rect x="72" y="0" width="18" height="9" rx="2" fill="#58a6ff"/>
      <rect x="96" y="0" width="18" height="9" rx="2" fill="#79c0ff"/>
      <rect x="120" y="0" width="18" height="9" rx="2" fill="#238636"/>
      <rect x="144" y="0" width="18" height="9" rx="2" fill="#3fb950"/>
      <rect x="168" y="0" width="18" height="9" rx="2" fill="#e6edf3"/>
      
      <!-- Blinking Terminal Prompt Cursor -->
      <rect x="200" y="-3" width="7" height="15" fill="#3fb950" rx="1">
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>